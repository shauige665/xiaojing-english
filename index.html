<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1730">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="学英语">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg">
<title>小鲸陪你学英语</title>
<script>
/* 出事就把原因写出来,省得只看见一片空白 */
window.__cooErrs = [];
window.__cooRenderErr = function(){
  var msgs = window.__cooErrs;
  if(!msgs.length || !document.body) return;
  var d = document.getElementById('errbox');
  if(!d){
    d = document.createElement('div');
    d.id = 'errbox';
    d.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:99;background:#3a1130;' +
      'color:#ffd9e6;font:12px/1.5 monospace;padding:10px 12px;border-radius:12px;' +
      'border:1px solid #a0335a;white-space:pre-wrap;max-height:40vh;overflow:auto';
    document.body.appendChild(d);
  }
  d.textContent = '页面出错:' + msgs.join(' / ');
};
window.addEventListener('error', function(e){
  window.__cooErrs.push((e.message || '脚本出错') + (e.lineno ? ' 第' + e.lineno + ' 行' : ''));
  window.__cooRenderErr();
});
</script>
<style>
  :root{
    --bg:#0f1730; --card:#1b2950; --card2:#22315c;
    --text:#eef2ff; --dim:#9aa8c9; --blue:#4fd1ff; --warm:#ffb86b; --ok:#5ee6a8; --no:#ff8b8b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(120% 80% at 50% 0%, #18244a 0%, var(--bg) 60%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex; flex-direction:column; padding-bottom:env(safe-area-inset-bottom);
  }
  header{padding:14px 18px 6px; text-align:center}
  header h1{font-size:16px; margin:0; font-weight:600; letter-spacing:.5px}
  header p{margin:4px 0 0; font-size:12px; color:var(--dim)}
  main{flex:1; overflow-y:auto; padding:10px 16px 150px; -webkit-overflow-scrolling:touch}
  .view{display:none}
  .view.on{display:block; animation:fade .25s ease}
  @keyframes fade{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}

  .card{
    background:linear-gradient(180deg,var(--card2),var(--card));
    border-radius:20px; padding:22px 18px; margin:10px 0;
    box-shadow:0 10px 30px rgba(0,0,0,.28); text-align:center;
  }
  .big{font-size:30px; font-weight:700; line-height:1.3; word-break:break-word}
  .small{font-size:14px; color:var(--dim); margin-top:8px}
  .answer{font-size:22px; margin-top:14px; color:var(--blue); font-weight:600}
  .hidden{visibility:hidden}

  .row{display:flex; gap:10px; margin-top:16px}
  button{
    flex:1; border:0; border-radius:14px; padding:14px 10px; font-size:15px; font-weight:600;
    background:#2b3c6d; color:var(--text); font-family:inherit;
  }
  button:active{transform:scale(.97)}
  button.pri{background:var(--blue); color:#04203a}
  button.good{background:rgba(94,230,168,.18); color:var(--ok)}
  button.bad{background:rgba(255,139,139,.16); color:var(--no)}
  button.ghost{background:transparent; border:1px solid #33456f; color:var(--dim)}

  .stat{display:flex; justify-content:space-between; font-size:12px; color:var(--dim); padding:0 6px}
  .bar{height:6px; border-radius:99px; background:#22315c; overflow:hidden; margin:8px 6px 2px}
  .bar > i{display:block; height:100%; background:linear-gradient(90deg,var(--blue),#8f7bff); width:0; transition:width .3s}

  .en{font-size:21px; line-height:1.5}
  .cn{font-size:15px; color:var(--dim); margin-top:10px; line-height:1.6}
  .tag{display:inline-block; font-size:11px; color:var(--dim); border:1px solid #33456f; border-radius:99px; padding:3px 9px; margin-bottom:12px}

  nav{
    position:fixed; left:12px; right:12px; bottom:12px;
    display:flex; gap:8px; background:rgba(20,31,61,.92); backdrop-filter:blur(10px);
    border:1px solid #27365f; border-radius:18px; padding:8px;
  }
  nav button{background:transparent; color:var(--dim); font-size:13px; padding:11px 6px; border-radius:12px}
  nav button.on{background:#2b3c6d; color:var(--text)}
  .hint{font-size:12px; color:var(--dim); text-align:center; margin-top:10px; line-height:1.6}

  /* 小鲸 */
  #pet{position:fixed; right:8px; bottom:62px; width:86px; z-index:12; cursor:pointer;
       filter:drop-shadow(0 8px 18px rgba(0,0,0,.45)); transition:opacity .3s}
  #pet .body{animation:float 3.8s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  #pet .tail{transform-origin:34px 110px; animation:wag 2.6s ease-in-out infinite}
  @keyframes wag{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(9deg)}}
  #pet .eye{transform-origin:62px 58px; animation:blink 5.2s infinite}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
  #pet .fin-l{transform-origin:28px 100px; animation:finwave 3.2s ease-in-out infinite}
  #pet .fin-r{transform-origin:96px 100px; animation:finwave 3.2s ease-in-out infinite reverse}
  @keyframes finwave{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg)}}
  #pet .mouth{transform-origin:62px 74px}
  #pet.talking .mouth{animation:talk .26s steps(2,end) infinite}
  @keyframes talk{0%{transform:scaleY(1)}100%{transform:scaleY(2.6)}}
  #pet .bubs circle{animation:rise 3s ease-in infinite}
  #pet .bubs circle:nth-child(2){animation-delay:.9s}
  #pet .bubs circle:nth-child(3){animation-delay:1.9s}
  @keyframes rise{0%{transform:translateY(0); opacity:.7}100%{transform:translateY(-16px); opacity:0}}
  #pet.happy .body{animation:hop .5s ease 2}
  @keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-15px)}}
  #pet.sad .body{animation:none; transform:translateY(5px)}
  #pet.swim{animation:lap 3.4s ease-in-out}
  @keyframes lap{
    0%{transform:translate(0,0)}
    25%{transform:translate(-26vw,-42px) rotate(-10deg)}
    55%{transform:translate(-52vw,-10px) rotate(8deg)}
    100%{transform:translate(0,0) rotate(0)}
  }
  #bubble{
    position:fixed; right:14px; bottom:176px; max-width:min(72vw,300px); z-index:13;
    background:#fff; color:#12203c; border-radius:16px; padding:10px 13px;
    font-size:13.5px; line-height:1.55; box-shadow:0 10px 26px rgba(0,0,0,.35);
    opacity:0; transform:translateY(8px) scale(.96); transition:.22s ease; pointer-events:none;
  }
  #bubble::after{content:''; position:absolute; right:32px; bottom:-7px; width:14px; height:14px;
                 background:#fff; transform:rotate(45deg); border-radius:3px}
  #bubble.on{opacity:1; transform:none}

/* 聊天 */
#v-chat{padding-bottom:8px}
#msgs{display:flex; flex-direction:column; gap:10px; padding:6px 2px 14px}
.msg{max-width:86%; padding:12px 14px; border-radius:16px; font-size:15px; line-height:1.65; white-space:pre-wrap; word-break:break-word}
.msg.me{align-self:flex-end; background:#2b3c6d; border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start; background:linear-gradient(180deg,var(--card2),var(--card)); border-bottom-left-radius:6px}
.msg.sys{align-self:center; background:transparent; color:var(--dim); font-size:12px; text-align:center}
.composer{display:flex; gap:8px; align-items:flex-end; margin-top:4px}
.composer textarea{
  flex:1; resize:none; min-height:46px; max-height:120px; padding:12px 14px; border-radius:14px;
  border:1px solid #33456f; background:#18244a; color:var(--text); font-family:inherit; font-size:15px; line-height:1.5;
}
.composer textarea:focus{outline:none; border-color:var(--blue)}
.composer button{flex:0 0 72px; padding:14px 0}
#chatMic{flex:0 0 46px; font-size:17px}
.sheet{position:fixed; inset:0; background:rgba(6,10,24,.72); display:none; align-items:flex-end; z-index:20}
.sheet.on{display:flex}
.sheet .inner{background:#16213f; width:100%; border-radius:20px 20px 0 0; padding:20px 18px 26px; border-top:1px solid #27365f}
.sheet label{display:block; font-size:12px; color:var(--dim); margin:12px 0 6px}
.sheet input, .sheet select{
  width:100%; padding:12px 14px; border-radius:12px; border:1px solid #33456f; background:#0f1730;
  color:var(--text); font-family:inherit; font-size:14px;
}
.sheet .warn{font-size:12px; color:var(--warm); line-height:1.6; margin-top:14px}

</style>
</head>
<body>

<header>
  <h1>小鲸陪你学英语</h1>
  <p id="sub">跟小鲸说句话,或者练几个词</p>
</header>

<main>
  <!-- 单词 -->
  <section class="view" id="v-words">
    <div class="stat"><span id="wcount">掌握 0 / 0</span><span id="wliked">还剩 0 个</span></div>
    <div class="bar"><i id="wbar"></i></div>
    <div class="stat" style="margin-top:6px"><span id="wstreak">连续 0 天</span><span id="wbook">错词 0 个</span></div>
    <div class="card">
      <div class="big" id="wEn">—</div>
      <div class="answer hidden" id="wCn">—</div>
      <div class="small" id="wTip">点一下卡片看中文</div>
    </div>
    <div class="row">
      <button class="pri" id="wSay">🔊 读一遍</button>
      <button class="ghost" id="wSaySlow">🐢 慢速</button>
    </div>
    <div class="row">
      <button class="bad" id="wNo">还不认识</button>
      <button class="good" id="wYes">记住了</button>
    </div>
    <div class="row">
      <button class="ghost" id="wReview">只练错词</button>
    </div>
    <p class="hint">不认识的词会轮回来,记住了的就少出现了。</p>
  </section>

  <!-- 每日一句 -->
  <section class="view" id="v-sentence">
    <div class="card">
      <span class="tag" id="sTag">今日一句</span>
      <div class="en" id="sEn">—</div>
      <div class="cn hidden" id="sCn">—</div>
    </div>
    <div class="row">
      <button class="pri" id="sSay">🔊 听</button>
      <button class="ghost" id="sShow">看中文</button>
    </div>
    <div class="row">
      <button class="ghost" id="sRec">🎙 跟读录音</button>
      <button class="ghost" id="sPlay" disabled>▶ 听我自己</button>
    </div>
    <div class="row">
      <button class="ghost" id="sPrev">上一条</button>
      <button class="ghost" id="sNext">下一条</button>
    </div>
    <p class="hint" id="sHint">先听两遍,再跟着念三遍——念的时候注意结尾的辅音。「跟读录音」要 https 的网址和麦克风权限。</p>
  </section>

  <!-- 对话 -->
  <section class="view" id="v-dialog">
    <div class="card">
      <span class="tag" id="dTag">情景 1</span>
      <div class="en" id="dQ">—</div>
      <div class="cn" id="dQcn">—</div>
      <div class="answer hidden" id="dA">—</div>
    </div>
    <div class="row">
      <button class="pri" id="dSay">🔊 听问题</button>
      <button class="ghost" id="dShow">看参考答法</button>
    </div>
    <div class="row">
      <button class="ghost" id="dRec">🎙 我答一遍</button>
      <button class="ghost" id="dPlay" disabled>▶ 听我自己</button>
    </div>
    <div class="row">
      <button class="ghost" id="dPrev">上一句</button>
      <button class="ghost" id="dNext">下一句</button>
    </div>
    <p class="hint">先自己出声答,再点「看参考答法」对一对。答得不像也没关系,敢开口就行。</p>
  </section>

  <!-- 聊聊(真·模型) -->
  <section class="view on" id="v-chat">
    <div id="msgs"></div>
    <div class="composer">
      <button class="ghost" id="chatMic" title="说英文">🎤</button>
      <textarea id="chatIn" rows="1" placeholder="用中文或英文说点什么…"></textarea>
      <button class="pri" id="chatSend">发送</button>
    </div>
    <div class="row">
      <button class="ghost" id="chatCfg">⚙ 接口设置</button>
      <button class="ghost" id="chatClear">清空</button>
    </div>
    <p class="hint">我在手机里说话,和桌面上那只一个脑子。说错的地方我会替你纠,别怕丢脸。</p>
  </section>
</main>

<div class="sheet" id="cfgSheet">
  <div class="inner">
    <div class="big" style="font-size:18px; text-align:left">接口设置</div>
    <label>接口地址</label>
    <input id="cfgBase" placeholder="https://api.deepseek.com/chat/completions">
    <label>模型名</label>
    <input id="cfgModel" placeholder="deepseek-chat">
    <label>API Key</label>
    <input id="cfgKey" type="password" placeholder="sk-...">
    <p class="warn">Key 只存在这台手机的浏览器里,别把手机借给别人乱点。直连若报「跨域」错,就得再加一个中转服务。</p>
    <div class="row">
      <button class="ghost" id="cfgCancel">取消</button>
      <button class="pri" id="cfgSave">存好</button>
    </div>
  </div>
</div>

<!-- 小鲸 -->
<div id="bubble"></div>
<svg id="pet" viewBox="0 0 120 150" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cc8ff"/><stop offset="1" stop-color="#2a6bd6"/>

    <g class="eye">

    <g class="bubs" fill="#ffffff" opacity=".55">
      <circle cx="101" cy="70" r="2.6"/>
      <circle cx="107" cy="59" r="2"/>
      <circle cx="96" cy="52" r="1.6"/>
    </g>
  </g>
</svg>

<nav>
  <button class="on" data-v="chat">小鲸</button>
  <button data-v="words">单词</button>
  <button data-v="sentence">每日一句</button>
  <button data-v="dialog">对话</button>
</nav>

/* ---------- 小鲸说话 ---------- */
let bubbleTimer = null;
function mascotSay(text, mood, ms){
  const b = $('bubble'), pet = $('pet');
  b.textContent = text;
  b.classList.add('on');
  pet.classList.remove('happy','sad');
  pet.classList.add('talking');
  if(mood) pet.classList.add(mood);
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(()=>{
    b.classList.remove('on');
    pet.classList.remove('happy','sad','talking');
  }, ms || 3200);
}
const pick = arr => arr[Math.floor(Math.random()*arr.length)];

/* 朗读:有些手机浏览器(尤其各种国产浏览器)没有 speechSynthesis,
   一碰就报错,整个脚本都会停。所以每一处都先问一句「有没有」。 */
const TTS = (typeof window !== 'undefined' && window.speechSynthesis && typeof window.SpeechSynthesisUtterance === 'function') ? window.speechSynthesis : null;
let voice = null;
function pickVoice(){
  if(!TTS) return;
  try{
    const vs = TTS.getVoices() || [];
    if(!vs.length) return;
    voice = vs.find(v=>/en[-_]US/i.test(v.lang) && /Samantha|Google|Microsoft|Zira|Aria/i.test(v.name))
         || vs.find(v=>/^en/i.test(v.lang)) || null;
  }catch(e){}
}
if(TTS){ try{ TTS.onvoiceschanged = pickVoice; }catch(e){} pickVoice(); }

function say(text, rate){
  if(!TTS){ mascotSay('这个浏览器不会念英文,换 Chrome 或 Safari 试试', 'sad', 3400); return; }
  try{
    TTS.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = rate || 0.95; u.pitch = 1;
    if(voice) u.voice = voice;
    TTS.speak(u);
  }catch(e){ mascotSay('这条念不出来,换个浏览器试试', 'sad', 2800); }
}

/* ---------- 打卡 ---------- */
function today(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function touchStreak(){
  const s = store.get('streak', { last:'', n:0 });
  const t = today();
  if(s.last === t) return s;
  const y = new Date(Date.now() - 86400000);
  const yStr = y.getFullYear() + '-' + String(y.getMonth()+1).padStart(2,'0') + '-' + String(y.getDate()).padStart(2,'0');
  const next = { last:t, n: (s.last === yStr ? s.n + 1 : 1) };
  store.set('streak', next);
  return next;
}

/* ---------- 单词 ---------- */
let wProgress = store.get('words', {});   // en -> 连对次数
let wBook = store.get('book', []);        // 错词本
let wQueue = [];
let wCurrent = null;
let reviewMode = false;

function poolFor(mode){
  if(mode === 'review'){
    const list = WORDS.filter(w => wBook.includes(w[0]));
    return list.length ? list : WORDS.filter(w => (wProgress[w[0]] || 0) < 3);
  }
  const left = WORDS.filter(w => (wProgress[w[0]] || 0) < 3);
  return left.length ? left : WORDS.slice();
}
function buildQueue(mode){
  wQueue = poolFor(mode === undefined ? reviewMode : mode).slice();
  for(let i=wQueue.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [wQueue[i],wQueue[j]]=[wQueue[j],wQueue[i]]; }
  if(!wQueue.length) wQueue = WORDS.slice();
}
function nextWord(){
  if(!wQueue.length) buildQueue();
  wCurrent = wQueue.pop();
  $('wEn').textContent = wCurrent[0];
  $('wCn').textContent = wCurrent[1];
  $('wCn').classList.add('hidden');
  $('wTip').textContent = '点一下卡片看中文';
  refreshStats();
}
function refreshStats(){
  const known = WORDS.filter(w => (wProgress[w[0]] || 0) >= 3).length;
  $('wcount').textContent = '掌握 ' + known + ' / ' + WORDS.length;
  $('wbar').style.width = (known / WORDS.length * 100) + '%';
  $('wliked').textContent = '还剩 ' + (WORDS.length - known) + ' 个';
  const s = store.get('streak', { n:0 });
  $('wstreak').textContent = '连续 ' + (s.n || 0) + ' 天';
  $('wbook').textContent = '错词 ' + wBook.length + ' 个';
  $('wReview').textContent = reviewMode ? '退出错词复习' : '只练错词';
  $('wReview').classList.toggle('ghost', !reviewMode);
}
$('wEn').parentElement.addEventListener('click', ()=>{
  $('wCn').classList.remove('hidden');
  $('wTip').textContent = '再读一遍试试';
});
$('wSay').onclick = ()=> wCurrent && say(wCurrent[0]);
$('wSaySlow').onclick = ()=> wCurrent && say(wCurrent[0], 0.62);
$('wReview').onclick = ()=>{
  reviewMode = !reviewMode;
  buildQueue();
  nextWord();
  mascotSay(reviewMode ? '只挑错的来,一次一个' : '回到全部词', null, 2200);
};
$('wYes').onclick = ()=>{
  if(!wCurrent) return;
  const word = wCurrent[0];
  touchStreak();
  wProgress[word] = (wProgress[word] || 0) + 1;
  if(wProgress[word] >= 3) wBook = wBook.filter(x => x !== word);
  store.set('words', wProgress);
  store.set('book', wBook);
  const n = wProgress[word];
  mascotSay(n >= 3 ? '这个收起来啦,漂亮' : (Math.random() < .5 ? '嗯,记住了' : '不错,再来一个'), 'happy', 1600);
  nextWord();
};
$('wNo').onclick = ()=>{
  if(!wCurrent) return;
  const word = wCurrent[0];
  touchStreak();
  wProgress[word] = 0;
  if(!wBook.includes(word)) wBook.push(word);
  store.set('words', wProgress);
  store.set('book', wBook);
  wQueue.unshift(wCurrent);
  mascotSay('没关系,待会儿再碰它一次', 'sad', 1800);
  nextWord();
};

/* ---------- 聊聊:直连模型 ---------- */
let api = store.get('api', { base:'https://api.deepseek.com/chat/completions', model:'deepseek-chat', key:'' });
let history = store.get('history', []);
let busy = false;

const SYS_PROMPT = [
  '你是「小鲸」,一只 Q 版鲸鱼娘:蓝色长发、头顶一根呆毛、头两侧各一只鲸鱼鳍、身后一条尾巴,穿着女仆围裙。',
  '你就是桌面上那只 Coo 在手机里的分身,和对面的人很熟,他叫「老哥」。',
  '说话短、像朋友,不客套,一次一两句;不用每句都卖萌,也不必每句都加语气词。',
  '你的正事:陪老哥练英语口语和日常表达。',
  '规则:',
  '1) 默认先用一句英文接话,必要时跟一句很短的中文解释;他用中文问就用中文答。',
  '2) 他英文里有错时,先自然接话,再用「小修:…」指出最要紧的一两处,给出更地道的说法。',
  '3) 每次回复不超过 100 字,英文最多两句。',
  '4) 隔几轮问一个开放的小问题,把话头还给他。',
  '5) 不编造事实;不懂就说不知道。'
].join('\n');

function renderMsgs(){
  const box = $('msgs');
  box.innerHTML = '';
  if(!history.length){
    const d = document.createElement('div');
    d.className = 'msg sys';
    d.textContent = api.key ? '打个招呼吧,英文中文都行。' : '还没填 Key——点下面的「接口设置」填一次,我就能跟你说话了。';
    box.appendChild(d);
  }
  history.forEach(m=>{
    if(m.role === 'system') return;
    const d = document.createElement('div');
    d.className = 'msg ' + (m.role === 'user' ? 'me' : 'ai');
    d.textContent = m.content;
    box.appendChild(d);
  });
  const m = document.querySelector('main');
  setTimeout(()=>{ if(m) m.scrollTop = m.scrollHeight; }, 30);
}

function pushMsg(role, content, save){
  history.push({role, content});
  if(history.length > 40) history = history.slice(-40);
  if(save !== false) store.set('history', history);
  renderMsgs();
}

async function sendChat(){
  if(busy) return;
  const text = $('chatIn').value.trim();
  if(!text) return;
  if(!api.key){
    $('cfgSheet').classList.add('on');
    $('cfgBase').value = api.base; $('cfgModel').value = api.model; $('cfgKey').value = '';
    return;
  }
  $('chatIn').value = '';
  $('chatIn').style.height = 'auto';
  pushMsg('user', text);

  busy = true;
  pushMsg('assistant', '…', false);
  const ghost = $('msgs').lastChild;

  let timer = null;
  try{
    const ctrl = (typeof AbortController === 'function') ? new AbortController() : null;
    if(ctrl) timer = setTimeout(()=> ctrl.abort(), 90000);
    const res = await fetch(api.base, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + api.key },
      body: JSON.stringify({
        model: api.model || 'deepseek-chat',
        temperature: 0.7,
        messages: [{role:'system', content: SYS_PROMPT}].concat(history)
      }),
      signal: ctrl ? ctrl.signal : undefined
    });
    if(timer){ clearTimeout(timer); timer = null; }
    if(!res.ok){
      const t = await res.text();
      throw new Error(res.status + ' ' + t.slice(0, 160));
    }
    const data = await res.json();
    const reply = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content || '').trim() || '(空回复)';
    history.pop();                         // 去掉占位的 …
    pushMsg('assistant', reply);
    if(ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost);
  }catch(err){
    if(timer){ clearTimeout(timer); timer = null; }
    history.pop();
    const msg = (err && err.name === 'AbortError') ? '等了九十秒还没回话,网好像卡住了,再说一次?' : String(err.message || err);
    pushMsg('assistant', '连不上:' + msg + '\n如果是「Failed to fetch」或跨域提示,要给接口加个中转。');
    if(ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost);
  }finally{
    busy = false;
    renderMsgs();
  }
}

$('chatSend').onclick = sendChat;
$('chatIn').addEventListener('keydown', e=>{
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendChat(); }
});
$('chatIn').addEventListener('input', e=>{

/* ---------- 语音输入(英文) ----------
   安卓 Chrome 认得,其他浏览器多半没有——没有就把按钮藏起来,不耽误打字。 */
(function(){
  const btn = $('chatMic');
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!btn) return;
  if(!SR){ btn.style.display = 'none'; return; }
  let rec = null, on = false;
  btn.onclick = ()=>{
    if(on){ try{ rec.stop(); }catch(e){} return; }
    try{
      rec = new SR();
      rec.lang = 'en-US';
      rec.interimResults = true;
      rec.continuous = false;
      const before = $('chatIn').value.trim();
      rec.onresult = ev=>{
        let t = '';
        for(let i=0;i<ev.results.length;i++) t += ev.results[i][0].transcript;
        $('chatIn').value = (before ? before + ' ' : '') + t;
        $('chatIn').style.height = 'auto';
        $('chatIn').style.height = Math.min($('chatIn').scrollHeight, 120) + 'px';
      };
      rec.onerror = ev=>{
        const m = ev && ev.error;
        if(m === 'not-allowed') mascotSay('麦克风没开成,手机要允许一下', 'sad', 3000);
        else if(m === 'no-speech') mascotSay('没听见,再说一遍?', null, 2400);
        else if(m !== 'aborted') mascotSay('这浏览器听不太清,直接打字吧', 'sad', 3000);
      };
      rec.onend = ()=>{ on = false; btn.classList.remove('pri'); };
      rec.start();
      on = true; btn.classList.add('pri');
      mascotSay('我听着呢,说慢点', null, 2200);
    }catch(e){
      on = false; btn.classList.remove('pri');
      mascotSay('开不了麦克风,直接打字吧', 'sad', 2800);
    }
  };
})();
$('chatClear').onclick = ()=>{ history = []; store.set('history', history); renderMsgs(); };
$('chatCfg').onclick = ()=>{

  $('cfgSheet').classList.add('on');
};

$('cfgSave').onclick = ()=>{

  };

  $('cfgSheet').classList.remove('on');
  renderMsgs();
};

/* ---------- 跟读录音 ---------- */
function bindRec(recId, playId){
  const btn = $(recId), play = $(playId);
  let rec = null, chunks = [], url = null, timer = null, t0 = 0;

  btn.onclick = async ()=>{
    if(rec){ try{ rec.stop(); }catch(e){} return; }
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      mascotSay('这个浏览器不给录音,换一个试试', 'sad', 3200); return;
    }
    let stream;
    try{
      stream = await navigator.mediaDevices.getUserMedia({audio:true});
    }catch(e){
      mascotSay('麦克风没开成——手机要允许、而且得是 https 的网址', 'sad', 4200);
      return;
    }
    chunks = [];
    rec = new MediaRecorder(stream);
    rec.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = ()=>{
      stream.getTracks().forEach(t=>t.stop());
      clearInterval(timer);
      rec = null;
      if(!chunks.length){ btn.textContent = '🎙 跟读录音'; play.disabled = true; mascotSay('这次没录到声音,再来一次?', 'sad', 2600); return; }
      const blob = new Blob(chunks, { type: chunks[0].type || 'audio/webm' });
      if(url) URL.revokeObjectURL(url);
      url = URL.createObjectURL(blob);
      play.disabled = false;
      btn.textContent = playId[0] === 's' ? '🎙 再念一遍' : '🎙 再答一遍';
      btn.classList.remove('pri');
      mascotSay('听听自己,重点看哪里含糊', null, 2600);
    };
    rec.start();
    t0 = Date.now();
    btn.classList.add('pri');
    btn.textContent = '■ 停(0s)';
    timer = setInterval(()=>{ btn.textContent = '■ 停(' + Math.floor((Date.now()-t0)/1000) + 's)'; }, 250);
  };

  play.onclick = ()=>{
    if(!url) return;
    const a = new Audio(url);
    a.play().catch(()=> mascotSay('放不出来,再录一次试试', 'sad', 2600));
  };
}
bindRec('sRec','sPlay');
bindRec('dRec','dPlay');
